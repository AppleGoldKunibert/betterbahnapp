name = "betterbahn-stats"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

# Train statistics (#316). Created once with `npx wrangler d1 create betterbahn-stats` and schema.sql
# (see README.md); filled once a day by importer.py (.github/workflows/train-stats-import.yml).
[[d1_databases]]
binding = "DB"
database_name = "betterbahn-stats"
database_id = "8e54043e-cfd7-48fd-be13-d26497af6b43"

# No cron any more (#336): an empty list removes the old ones on deploy.
[triggers]
crons = []

# Per app install: 60 train-statistics lookups per minute. namespace_id is any number unique within the account.
[[ratelimits]]
name = "STATS_LIMITER"
namespace_id = "1302"
simple = { limit = 60, period = 60 }

# Secrets (`npx wrangler secret put …`): TOKEN_SECRET (same value as in betterbahn2, betterbahn and betterbahn-pass).
# ALLOW_UNATTESTED = "true" lets apps without App Attest (Simulator) ask.
