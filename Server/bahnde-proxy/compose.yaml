# Home server or VPS: `TOKEN_SECRET=… docker compose up -d --build` (see README.md).
services:
  bahnde-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET:?same value as in the Cloudflare Workers}
      IMPERSONATE: ${IMPERSONATE:-safari}
      # DB API Marketplace (RIS::Journeys); without them those paths answer 404.
      DB_CLIENT_ID: ${DB_CLIENT_ID:-}
      DB_API_KEY: ${DB_API_KEY:-}
      # Coach sequences from DB Regio's Wi-Fi portal first ("false": bahn.de only).
      REGIO: ${REGIO:-true}
    volumes:
      # Refusals of the portal and coach sequences it didn't have: logs/regio.log.
      - regio-logs:/app/logs

volumes:
  regio-logs:
