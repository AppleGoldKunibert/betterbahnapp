name: Bug report
description: Something in the app does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. …
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "26.0"
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About, or the TestFlight build number.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Optional, but very helpful for layout problems.
