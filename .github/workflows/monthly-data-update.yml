# Rebuilds the offline station lists (Ril100.json, StationNames.json, StationHints.json) once a month
# and opens a PR into prod on a branch named monthlyupdate-<month>/<year> (e.g. monthlyupdate-08/26).
# Nothing is merged automatically: the PR is meant to be reviewed for odd changes first. Runs only
# when something changed, and stops without a PR when a list came out empty or much smaller
# (scripts/check-data-update.py). A PR opened with the default token doesn't start the other
# workflows, so push an empty commit to the branch to run the Kit tests.
# Schedules only run from the default branch (prod). Needs Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests".
name: Monthly data update

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-data-update
  cancel-in-progress: false

env:
  # DB InfraGO's operating points (CC BY 4.0) on the Mobilithek and its XLSX of all abbreviations,
  # whose address changes when DB publishes a new file (then the run fails here: update the URL).
  INFRA_URL: https://mobilithek.info/mdp-api/files/aux/922109165921083392/Infrastrukturdaten.zip
  ABBREVIATIONS_URL: https://www.dbinfrago.com/resource/blob/12593004/d363d64ef7ecc1792c1518075d8ea769/Download-betriebsstellen-data.xlsx
  NETEX_URL: https://bahnhof.de/daten/netex

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0

      - name: Pick the branch name
        id: branch
        run: |
          branch="monthlyupdate-$(date -u +%m)/$(date -u +%y)"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::Branch $branch already exists, nothing to do. Delete it to run again."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.branch.outputs.exists != 'true'
        with:
          python-version: "3.12"

      - name: Download the sources
        if: steps.branch.outputs.exists != 'true'
        run: |
          pip install openpyxl
          mkdir "$RUNNER_TEMP/data" && cd "$RUNNER_TEMP/data"
          curl -fsSL --retry 3 -o infra.zip "$INFRA_URL"
          unzip -q infra.zip
          curl -fsSL --retry 3 -o betriebsstellen.xlsx "$ABBREVIATIONS_URL"
          curl -fsSL --retry 3 --compressed -o netex.xml "$NETEX_URL"
          ls -l

      - name: Rebuild the lists
        if: steps.branch.outputs.exists != 'true'
        run: |
          data="$RUNNER_TEMP/data"
          python3 scripts/make-ril100.py "$data/M1 Betriebsstellen.csv" "$data/betriebsstellen.xlsx"
          # Needs the new Ril100.json for the stations' positions; only asks bahn.expert for new stations.
          python3 scripts/make-station-names.py "$data/netex.xml"
          # The collection's big stations (#384), named as in the new StationNames.json.
          python3 scripts/make-big-stations.py "$data/netex.xml"
          python3 scripts/make-station-hints.py

      - name: Check the result
        id: check
        if: steps.branch.outputs.exists != 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "::notice::No changes this month."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          python3 scripts/check-data-update.py | tee "$RUNNER_TEMP/table.md"
          cat "$RUNNER_TEMP/table.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open the PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Packages/BetterBahnKit/Sources/BetterBahnKit/Resources
          git add Packages/BetterBahnKit/Sources/BetterBahnKit/Models/BigStations.swift
          git commit -m "Update offline station data ($(date -u +%m/%Y))"
          git push -u origin "$BRANCH"
          {
            echo "Monthly rebuild of the offline station lists with \`scripts/make-ril100.py\`,"
            echo "\`make-station-names.py\`, \`make-big-stations.py\` and \`make-station-hints.py\`."
            echo
            cat "$RUNNER_TEMP/table.md"
            echo
            echo "Check the diff for odd changes. CI doesn't start on its own for this PR: push an empty commit."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base prod --head "$BRANCH" \
            --title "Update offline station data ($(date -u +%m/%Y))" \
            --body-file "$RUNNER_TEMP/body.md"
