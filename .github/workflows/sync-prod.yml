# Merges every push to prod into all other branches that don't contain it yet.
# Branches that can be fast-forwarded are; branches with no code prod doesn't have are
# reset to prod (so they don't show up as "ahead"); others get a merge commit. Branches with
# merge conflicts are skipped and listed in the run summary (the run then fails so
# GitHub notifies you). Branches in `skip` (the App Store release branch and the external TestFlight
# branch `externaltester`) are left alone, so prod changes only reach them when merged manually.
name: Sync prod into branches

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-prod
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge prod into branches that are behind
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          skip=(appstorerelease externaltester)
          failed=()
          echo "## Sync prod → branches" >> "$GITHUB_STEP_SUMMARY"

          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            [ "$ref" = "HEAD" ] || [ "$ref" = "prod" ] && continue
            if [[ " ${skip[*]} " == *" $ref "* ]]; then
              echo "- \`$ref\`: skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            old=$(git rev-parse "origin/$ref")
            if [ "$old" = "$(git rev-parse origin/prod)" ]; then
              echo "- \`$ref\`: up to date" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Same code as prod (e.g. only leftover merge commits): point the branch at prod so it
            # doesn't show up as ahead.
            if git diff --quiet origin/prod "origin/$ref"; then
              if git push --force-with-lease="$ref:$old" origin "origin/prod:refs/heads/$ref"; then
                echo "- \`$ref\`: reset to prod (no own changes)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`$ref\`: ❌ reset failed (protected branch?)" >> "$GITHUB_STEP_SUMMARY"
                failed+=("$ref")
              fi
              continue
            fi

            if git merge-base --is-ancestor origin/prod "origin/$ref"; then
              echo "- \`$ref\`: up to date" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            git checkout -q -B "$ref" "origin/$ref"
            if git merge --no-edit origin/prod -m "Merge prod into $ref"; then
              # The branch's changes were already in prod: skip the merge commit and reset instead.
              if git diff --quiet origin/prod HEAD; then
                git reset -q --hard origin/prod
                push_args=(--force-with-lease="$ref:$old")
              else
                push_args=()
              fi
              if git push "${push_args[@]}" origin "$ref"; then
                echo "- \`$ref\`: merged prod" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`$ref\`: ❌ push failed (protected branch?)" >> "$GITHUB_STEP_SUMMARY"
                failed+=("$ref")
              fi
            else
              git merge --abort
              echo "- \`$ref\`: ❌ merge conflict – merge prod manually" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Merge conflict merging prod into $ref"
              failed+=("$ref")
            fi
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Could not sync: ${failed[*]}"
            exit 1
          fi
