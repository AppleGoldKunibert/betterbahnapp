# Checks every PR for committed secrets (API keys, tokens, private keys) with gitleaks, and makes
# sure the old DB credentials file (the key is now a Worker secret) never ends up in the repo.
# Runs on Linux, so it's cheap.
name: Secret scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Credentials file not committed
        run: |
          file=Packages/BetterBahnKit/Sources/BetterBahnKit/Transit/Timetables/DefaultCredentials.swift
          if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
            echo "::error file=$file::DefaultCredentials.swift must not be committed (the key is a Worker secret now)"
            exit 1
          fi

      # The CLI is used instead of gitleaks-action, which needs a paid license for organizations.
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Scan PR commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="HEAD"
          fi
          ./gitleaks git --log-opts="$range" --redact --verbose --exit-code 1 .
